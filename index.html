<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>GoForge — Deep Go</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf3ff;background:#0d1420}*{box-sizing:border-box}body{margin:0}a{color:#9dddfb}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}aside{background:#131f30;padding:25px 16px;border-right:1px solid #324052}main{padding:32px;max-width:1120px;width:100%;margin:0 auto}.brand{font-size:24px;font-weight:800;margin-bottom:8px}.muted{color:#9aafc7;font-size:13px;line-height:1.55}.modules{display:grid;gap:5px;margin:18px 0 30px}button{font:inherit;cursor:pointer;border:1px solid #43556d;border-radius:10px;padding:10px 14px;background:#203047;color:#edf3ff;text-align:left}button:hover{filter:brightness(1.15)}button.active,.primary{background:#2384ba;border-color:#2384ba;color:white}.modules button{font-size:13px}.small{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0}.tabs button{min-width:95px;text-align:center}.card{border:1px solid #34475e;background:#162439;border-radius:16px;padding:21px;margin:16px 0;line-height:1.62}.card h3{margin:0 0 10px}.pill{font-size:12px;border:1px solid #536c87;border-radius:30px;padding:4px 10px;color:#b5d8e8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .card{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}textarea{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0b1320;color:#f1f8ff;border:1px solid #556780;border-radius:10px;width:100%;min-height:190px;padding:15px;tab-size:4}textarea:focus{outline:2px solid #3eb4ec}.hint{padding:10px 13px;border-left:3px solid #4ebdeb;background:#1e3249;margin:7px 0}.notice{background:#23344b;padding:14px 16px;border-radius:10px;font-size:14px;color:#cfe2f9}.foot{padding:30px 0;color:#93a8bc;font-size:12px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{font-size:12px;color:#74c9f7;letter-spacing:.08em;text-transform:uppercase}.meter{background:#25364d;height:9px;border-radius:50px;overflow:hidden}.meter span{display:block;height:100%;background:#39bc9e}summary{cursor:pointer}.stat{color:#91e7cc;font-size:14px}.reveal{white-space:pre-wrap} @media(max-width:780px){.shell{display:block}aside{border:0;padding:13px}main{padding:16px}.modules{display:flex;overflow-x:auto;white-space:nowrap;margin:12px 0}.modules button{flex:none}.grid{grid-template-columns:1fr}h1{font-size:25px}.card{padding:15px}}

<body><div class="shell"><aside><div class="brand">◆ GoForge <span class="pill">MVP</span></div><div class="muted">Понять → написать → объяснить → повторить</div><nav class="modules" id="modules"></nav><button id="export">Экспорт прогресса JSON</button> <label class="small">Импорт <input id="import" type="file" accept=".json,application/json"></label><p class="muted">Прогресс сохраняется на этом устройстве. Облачной синхронизации пока нет.</p></aside><main><div class="titleline"><div><div class="top" id="count"></div><h1 id="title"></h1></div><span class="pill" id="stats"></span></div><p class="muted" id="description"></p><div class="tabs" id="tabs"><button data-tab="theory">Понять</button><button data-tab="practice">Писать код</button><button data-tab="interview">Собеседование</button><button data-tab="progress">Прогресс</button></div><section id="view"></section><div class="foot">Собственные задания GoForge. Первоисточник тем: <a href="https://github.com/Balun-courses/deep_go">deep_go</a>. Редактор пока не выполняет Go-код, сохранение попытки не означает прохождение тестов.</div></main></div>
<script>
"use strict";
const units=[
["Типы данных","Значения, указатели, память, переполнение и битовые операции.","Указатель — как записка с адресом квартиры. Он позволяет добраться до исходной переменной.","В Go указатель *T содержит адрес переменной типа T; & получает адрес, * разыменовывает. Указатель передаётся по значению.","Напиши функцию Inc(p *int), которая увеличивает исходное число на 1.",["Создай func Inc(p *int).","Разыменуй p через *p.","Используй *p++ или *p = *p + 1."],"Почему указатель не всегда означает аллокацию в куче?","Escape analysis и возможность размещения в стеке.","package main\n\nfunc Inc(p *int) {\n    // напиши код\n}\n"],
["Массивы и срезы","Массивы, slice header, backing array, append, subslices.","Срез — окно, через которое мы видим часть длинного ряда ячеек.","Slice содержит указатель на базовый массив, len и cap. append может создать новый backing array.","Напиши Sum(xs []int) int без использования готовых функций.",["Создай переменную sum.","Перебери xs через range.","Верни сумму элементов."],"Почему append возвращает новый срез?","Может измениться slice header и backing array.","package main\n\nfunc Sum(xs []int) int {\n    // код\n}\n"],
["Строки","UTF-8, byte, rune, range и неизменяемость.","Буква — не обязательно один байт. UTF-8 хранит разные символы разным числом байтов.","len(s) считает байты; range декодирует UTF-8. Строка неизменяема.","Напиши RuneCount(s string) int, который считает Unicode code points.",["Используй range по строке.","Счётчик увеличивается за каждую итерацию.","Не используй len(s) для числа рун."],"Чем byte отличается от rune?","byte — alias uint8; rune — alias int32, обычно Unicode code point.","package main\n\nfunc RuneCount(s string) int {\n    // код\n}\n"],
["Словари","Коллизии, hashing, Swiss Tables, сравнимость ключей.","Словарь — набор ящиков, номер которых вычисляется из ключа.","Map использует хэширование. В Go 1.24 реализация перешла на Swiss Tables; порядок итерации не гарантирован.","Напиши Count(words []string) map[string]int.",["Создай map[string]int через make.","Итерируйся по words.","Увеличивай счётчик для каждого слова."],"Можно ли одновременно читать и писать обычную map из разных горутин?","Без синхронизации нельзя; data race и некорректное поведение.","package main\n\nfunc Count(words []string) map[string]int {\n    // код\n}\n"],
["Функции","defer, замыкания, рекурсия и стек вызовов.","defer — записка: выполнить уборку, когда уходишь из комнаты.","Аргументы defer вычисляются при регистрации; вызовы выполняются LIFO.","Напиши функцию, возвращающую замыкание-счётчик func() int.",["Внешняя функция объявляет count.","Верни анонимную func() int.","При каждом вызове увеличивай count."],"В каком порядке выполняются несколько defer?","LIFO; аргументы чаще всего вычислены до выхода.","package main\n\nfunc Counter() func() int {\n    // код\n}\n"],
["Структуры","Поля, методы, embedding, padding, type aliases.","Структура — коробка с подписанными отделениями.","Компилятор выравнивает поля, вставляя padding. Method set зависит от receiver.","Определи тип User с полями Name string и Age int и методом Birthday().",["Определи type User struct.","Используй pointer receiver: func (u *User) Birthday().","Измени u.Age."],"Почему порядок полей struct влияет на её размер?","Выравнивание и padding; проверяется unsafe.Sizeof.","package main\n\n// Напиши тип User и метод Birthday\n"],
["Интерфейсы","Контракты, method sets, iface/eface, typed nil.","Интерфейс — форма розетки: любая подходящая вилка работает.","Тип неявно удовлетворяет интерфейсу при наличии нужных методов. Интерфейс с typed nil может быть != nil.","Определи интерфейс Speaker с методом Speak() string и тип Dog, который его реализует.",["Объяви type Speaker interface.","Метод Speak() string.","У типа Dog добавь соответствующий метод."],"Почему error с nil *MyError может быть не равен nil?","Интерфейс хранит и динамический тип, и значение.","package main\n\n// Напиши Speaker и Dog\n"],
["Обработка ошибок","errors.Is/As, wrapping, Join, panic/recover.","Ошибка — обычная записка, с которой вызывающая сторона решает, что делать.","error — интерфейс; %w сохраняет цепочку для errors.Is/As. panic не заменяет обычную обработку ошибок.","Напиши Wrap(err error) error, добавляющую контекст через fmt.Errorf и %w.",["Импортируй fmt.","Проверяй err == nil.","Верни fmt.Errorf с %w."],"Чем errors.Is отличается от errors.As?","Is проверяет совпадение или семантику ошибки, As извлекает совместимый тип.","package main\n\nimport \"fmt\"\n\nfunc Wrap(err error) error {\n    // код\n}\n"],
["Дженерики и рефлексия","Type parameters, constraints, reflection.","Дженерик — один рецепт для разных продуктов, отвечающих условиям.","Type parameters обеспечивают типобезопасный код; reflect позволяет исследовать значения во время исполнения.","Напиши First[T any](xs []T) (T, bool).",["Объяви var zero T.","Если len(xs)==0, верни zero,false.","Иначе xs[0],true."],"Когда generics полезнее интерфейсов?","Типобезопасные коллекции и алгоритмы без потери информации о типе.","package main\n\nfunc First[T any](xs []T) (T, bool) {\n    // код\n}\n"],
["Аллокатор","Stack/heap, spans, escape analysis и sync.Pool.","Стек — рабочий стол, куча — общий склад объектов.","Расположение объектов решает компилятор; sync.Pool не гарантирует долгого хранения.","Напиши BenchmarkConcat(b *testing.B) с b.ReportAllocs.",["Импорт testing.","Используй b.ReportAllocs().","Повторяй операцию b.N раз."],"Можно ли сделать вывод об аллокациях только по наличию указателя?","Нет; нужны escape analysis, benchmark, профилирование.","package bench\n\nimport \"testing\"\n\nfunc BenchmarkConcat(b *testing.B) {\n    // код\n}\n"],
["Сборщик мусора","Tracing GC, mark/sweep, barriers, GOGC и memory limit.","GC — уборщик, который ищет вещи, до которых ещё можно добраться.","Go использует конкурентную трассирующую сборку. Достижимость объектов и барьеры записи поддерживают корректность.","Напиши функцию ForceGC(), вызывающую runtime.GC().",["Импортируй runtime.","Объяви func ForceGC().","Вызови runtime.GC()."],"Зачем GC нужны write barriers?","Чтобы сохранять корректность графа достижимости при конкурентной маркировке.","package main\n\nimport \"runtime\"\n\nfunc ForceGC() {\n    // код\n}\n"],
["Горутины и планировщик Go","GMP, GOMAXPROCS, work stealing, syscalls, netpoller.","Планировщик — диспетчер, который распределяет много небольших задач по работникам.","G — goroutine, M — OS thread, P — ресурсы планировщика. Очереди и work stealing распределяют работу.","Запусти три горутины и дождись завершения через sync.WaitGroup.",["Импортируй sync.","Перед запуском вызови wg.Add(3).","Внутри горутины defer wg.Done(), затем wg.Wait()."],"Зачем в GMP модели нужен P?","P предоставляет ресурсы планировщика, необходимые для выполнения Go-кода.","package main\n\nimport \"sync\"\n\nfunc main() {\n    // код\n}\n"]
];
const KEY="goforge-deep-mvp-v1",fresh={unit:0,tab:"theory",drafts:{},hints:{},attempts:[],answers:{},recalled:[]};let s;try{s={...fresh,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{s={...fresh}};if(!Number.isInteger(s.unit)||s.unit<0||s.unit>=units.length)s.unit=0;
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),store=()=>localStorage.setItem(KEY,JSON.stringify(s));
function render(){const u=units[s.unit],n=s.unit;$("count").textContent="Продвинутый Go · модуль "+(n+1)+" из 12";$("title").textContent=u[0];$("description").textContent=u[1];$("modules").innerHTML=units.map((v,i)=>'<button data-unit="'+i+'" class="'+(i===n?"active":"")+'">'+(i+1)+". "+esc(v[0])+"</button>").join("");$("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));$("stats").textContent=s.attempts.length+" попыток";let out="";
if(s.tab==="theory")out='<div class="notice">Сначала прочитай, затем закрой и объясни механизм своими словами. Аналогия — не полное описание runtime.</div><div class="card"><h3>Простыми словами</h3><p>'+esc(u[2])+'</p><h3>Технически</h3><p>'+esc(u[3])+'</p></div><button class="primary" data-tab="practice">Перейти к написанию кода</button>';
if(s.tab==="practice"){let h=s.hints[n]||0;out='<div class="notice">Напиши решение своими руками. Если забыл — открой одну подсказку. После первой попытки сотри код и напиши заново без подсказок. <b>На публичном сайте компиляции нет; тесты первого задания доступны только в локальной версии.</b></div><div class="card"><h3>Задание</h3><p>'+esc(u[4])+'</p><textarea id="editor" spellcheck="false">'+esc(s.drafts[n]??u[8])+'</textarea><div class="actions"><button id="hint">Подсказка '+h+"/"+u[5].length+'</button><button id="clear">С нуля</button><button class="primary" id="save">Сохранить попытку</button>'+(n===0 && location.hostname==="127.0.0.1" && location.port==="8080"?'<button class="primary" id="run-tests">Запустить тесты</button>':'')+'</div><pre id="test-output" class="hint" style="white-space:pre-wrap" hidden></pre>'+u[5].slice(0,h).map((x,i)=>'<div class="hint">Шаг '+(i+1)+": "+esc(x)+"</div>").join("")+'<details><summary>Как проверить по-настоящему?</summary><p>Перенеси решение в локальный GoForge и проверь компиляцию и тесты командой <code>go test ./...</code>. Для первой задачи доступен локальный runner: запусти <code>go run ./cmd/local-runner</code> из корня репозитория и открой <code>http://127.0.0.1:8080/</code>. Остальные задачи пока не запускаются.</p></details></div>';}
if(s.tab==="interview")out='<div class="card"><h3>Объясни своими словами, как на собеседовании</h3><p>'+esc(u[6])+'</p><textarea id="answer" placeholder="Сначала ответь по памяти. Используй свои слова.">'+esc(s.answers[n]||"")+'</textarea><div class="actions"><button id="reveal">Показать опорные пункты</button><button class="primary" id="recall">Записать самостоятельный ответ</button></div><div id="reference" hidden class="hint">'+esc(u[7])+'</div><details><summary>На что обратить внимание?</summary><p>'+esc(u[7])+'</p></details></div>';
if(s.tab==="progress"){let c=s.attempts.filter(a=>a.hints===0).length;out='<div class="card"><h3>Прогресс</h3><p>Всего попыток: '+s.attempts.length+'. Без подсказок: '+c+'. Устных ответов: '+s.recalled.length+'.</p><div class="meter"><span style="width:'+Math.min(100,100*c/12)+'%"></span></div><p class="muted">Цель — не просто выполнить один раз, а повторить через день и затем ещё несколько раз.</p>'+units.map((x,i)=>'<p class="small">'+(i+1)+'. '+esc(x[0])+' · попыток: '+s.attempts.filter(a=>a.unit===i).length+'</p>').join("")+'</div>';}
$("view").innerHTML=out;if(s.tab==="practice"){$("editor").oninput=e=>{s.drafts[n]=e.target.value;store()};$("hint").onclick=()=>{s.hints[n]=Math.min(u[5].length,(s.hints[n]||0)+1);store();render()};$("clear").onclick=()=>{if(confirm("Начать с пустого редактора?")){s.drafts[n]="";s.hints[n]=0;store();render()}};$("save").onclick=()=>{let code=$("editor").value;if(!code.trim())return alert("Сначала напиши код");s.attempts.push({unit:n,code,hints:s.hints[n]||0,date:new Date().toISOString()});store();alert("Попытка сохранена. Это НЕ проверка компиляции или тестов.")}}if(s.tab==="practice"&&n===0&&$("run-tests")){$("run-tests").onclick=async()=>{const output=$("test-output");const btn=$("run-tests");output.hidden=false;output.textContent="Компиляция и тесты...";btn.disabled=true;try{const resp=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({taskId:"inc-pointer",code:$("editor").value})});if(!resp.ok)throw Error("HTTP "+resp.status);const result=await resp.json();output.textContent=(result.ok?"ТЕСТЫ ПРОЙДЕНЫ":"НЕ ПРОЙДЕНО")+(result.error?" — "+result.error:"")+"\n"+(result.output||"");s.attempts.push({unit:n,code:$("editor").value,hints:s.hints[n]||0,date:new Date().toISOString(),tested:true,passed:!!result.ok});store();}catch(err){output.textContent="Go runner недоступен. Запусти 'go run ./cmd/local-runner' и открой http://127.0.0.1:8080/. Ошибка: "+err.message}finally{btn.disabled=false}}}if(s.tab==="interview"){$("answer").oninput=e=>{s.answers[n]=e.target.value;store()};$("reveal").onclick=()=>{let v=$("reference");v.hidden=!v.hidden;v.textContent=u[7]};$("recall").onclick=()=>{s.recalled.push({unit:n,date:new Date().toISOString(),answer:$("answer").value});store();alert("Ответ сохранён для самостоятельного сравнения.")}}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-unit]");if(a){s.unit=Number(a.dataset.unit);s.tab="theory";store();render();scrollTo(0,0)}const t=e.target.closest("[data-tab]");if(t){s.tab=t.dataset.tab;store();render();scrollTo(0,0)}});$("export").onclick=()=>{let b=new Blob([JSON.stringify({schema:1,progress:s},null,2)],{type:"application/json"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="goforge-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};$("import").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.schema!==1||!j.progress||!Array.isArray(j.progress.attempts))throw Error("Неверный формат");if(confirm("Заменить текущий прогресс?")){s={...fresh,...j.progress};store();render()}}catch(err){alert(err.message)}};if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(console.warn);render();
</script><script src="./deep-content.js"></script><script src="./module-01.js"></script><script src="./module-01-tests.js"></script></body></html>
